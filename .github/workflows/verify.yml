# The gate, in one place.
#
# Called by `fast.yml` on every push and pull request, and by `deploy.yml` before anything
# reaches Cloud Run. One definition rather than two, because a gate that is duplicated is a
# gate that drifts — and the half that drifts is always the one guarding production.

name: verify

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: unit tests
        run: pnpm test:unit

      - name: format check
        run: pnpm check:format

      - name: payload leak check
        run: pnpm check:payload

      - name: assert nothing changed
        run: |
          pnpm format
          if [ -n "$(git status --porcelain)" ]; then
            echo "Formatter produced changes. Run 'pnpm format' and commit."
            git --no-pager diff
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads .gitleaks.toml from the repository root, which keeps the default rules and
      # adds exceptions for the synthetic values the tests need.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
