# Every push and every pull request runs the gate.
#
# The jobs themselves live in verify.yml, which deploy.yml also calls — so what guards a
# pull request and what guards production are the same definition, not two that agree today.

name: fast

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
