# Builds both images and rolls them out to Azure Container Apps.
#
# Nothing here configures anything. Only `--image` changes, so a push to main can alter what
# runs and never how it is configured — that lives in azure-setup.yml and is applied by hand.
#
# Authentication is OpenID Connect. GitHub presents a signed claim naming this repository and
# branch, Azure trusts it directly, and no long-lived credential exists to leak or rotate.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RESOURCE_GROUP: sentinel
  API_APP: sentinel-api
  SHOP_APP: sentinel-shop

permissions:
  contents: read
  id-token: write

# A second push supersedes this one rather than racing it. The in-progress run is not
# cancelled, because stopping halfway through a rollout leaves the revision split somewhere
# nobody chose.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing reaches production that has not passed the same gate a pull request passes.
  # These two workflows once both fired on a push and neither waited for the other, so a
  # commit could deploy while its own tests failed beside it.
  verify:
    uses: ./.github/workflows/verify.yml

  changes:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      storefront: ${{ steps.filter.outputs.storefront }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'packages/**'
              - 'Dockerfile'
              - 'pnpm-lock.yaml'
            storefront:
              - 'apps/storefront/**'
              - 'packages/**'
              - 'Dockerfile.storefront'
              - 'pnpm-lock.yaml'

  api:
    needs: [verify, changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push
        run: |
          ACR="${{ secrets.AZURE_ACR_NAME }}"
          az acr login --name "$ACR"

          IMAGE="$ACR.azurecr.io/sentinel-api"
          docker build --file Dockerfile --tag "$IMAGE:${{ github.sha }}" --tag "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # Updates the existing app in place — same name, same URL, a new revision taking the
      # traffic. A second app is never created: the name is a constant.
      - name: Deploy
        run: |
          az containerapp update \
            --name "${API_APP}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${{ secrets.AZURE_ACR_NAME }}.azurecr.io/sentinel-api:${{ github.sha }}" \
            --output none

          FQDN=$(az containerapp show --name "${API_APP}" --resource-group "${RESOURCE_GROUP}" --query properties.configuration.ingress.fqdn -o tsv)
          echo "- API: https://${FQDN}" >> $GITHUB_STEP_SUMMARY

  storefront:
    needs: [verify, changes]
    if: needs.changes.outputs.storefront == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # No build argument for the API's address: the shop reads API_BASE_URL at start-up and
      # injects it into index.html, so this image is built without knowing where the API is.
      - name: Build and push
        run: |
          ACR="${{ secrets.AZURE_ACR_NAME }}"
          az acr login --name "$ACR"

          IMAGE="$ACR.azurecr.io/sentinel-storefront"
          docker build --file Dockerfile.storefront --tag "$IMAGE:${{ github.sha }}" --tag "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy
        run: |
          az containerapp update \
            --name "${SHOP_APP}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${{ secrets.AZURE_ACR_NAME }}.azurecr.io/sentinel-storefront:${{ github.sha }}" \
            --output none

          FQDN=$(az containerapp show --name "${SHOP_APP}" --resource-group "${RESOURCE_GROUP}" --query properties.configuration.ingress.fqdn -o tsv)
          echo "- Storefront: https://${FQDN}" >> $GITHUB_STEP_SUMMARY
