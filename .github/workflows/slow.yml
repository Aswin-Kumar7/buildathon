name: slow

on:
  pull_request:

concurrency:
  group: slow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL: postgres://sentinel:sentinel@localhost:5432/sentinel_test

      - name: install playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Boots the real API and web app together. The unit suite once passed while the
      # running server returned 500 on every auth route, because tests and dev used
      # different transforms — only an end-to-end run catches that class of failure.
      - name: end-to-end tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://sentinel:sentinel@localhost:5432/sentinel_test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
