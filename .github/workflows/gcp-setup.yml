# One-time Google Cloud setup, run from GitHub because there is nowhere else to run it.
#
# The usual place for this is a terminal — Cloud Shell, or a local gcloud. Neither is
# available when the project belongs to someone else and nothing may be installed locally,
# so the service-account key that GitHub already holds is used to do the same work from a
# runner.
#
# Both steps are idempotent. Run them as often as you like.
#
#   provision  — enable the APIs and create the Artifact Registry repository.
#                Run this BEFORE the first deploy; the deploy has nowhere to push without it.
#
#   configure  — set environment variables and secrets on the two Cloud Run services.
#                Run this AFTER the first deploy, which is what creates them.
#
# Configuration lives here rather than in deploy.yml on purpose: a push to main should
# never be able to change how production is configured, only which image it runs.

name: GCP setup

on:
  workflow_dispatch:
    inputs:
      step:
        description: What to run
        required: true
        type: choice
        options: [provision, configure]

env:
  REGION: asia-south1
  REPOSITORY: sentinel

permissions:
  contents: read

jobs:
  provision:
    if: inputs.step == 'provision'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Attempted, not required. Enabling an API needs serviceusage.serviceUsageAdmin, and
      # a deploy account has no business holding it — the bootstrap is a one-time human
      # action. If this fails, the verify step below says exactly what a human must run.
      - name: Try to enable the APIs
        continue-on-error: true
        run: |
          gcloud services enable             run.googleapis.com             artifactregistry.googleapis.com             --project="${{ secrets.GCP_PROJECT_ID }}"

      - name: Try to create the Artifact Registry repository
        continue-on-error: true
        run: |
          gcloud artifacts repositories create "${REPOSITORY}"             --repository-format=docker             --location="${REGION}"             --project="${{ secrets.GCP_PROJECT_ID }}"

      # Every push adds an image tagged with its commit, and nothing removes the old ones.
      - name: Try to cap stored images at ten
        continue-on-error: true
        run: |
          cat > policy.json <<'JSON'
          [
            {
              "name": "keep-recent",
              "action": {"type": "Keep"},
              "mostRecentVersions": {"keepCount": 10}
            }
          ]
          JSON
          gcloud artifacts repositories set-cleanup-policies "${REPOSITORY}"             --location="${REGION}"             --project="${{ secrets.GCP_PROJECT_ID }}"             --policy=policy.json
          rm -f policy.json

      # The only step that decides whether this job passed. It checks the end state rather
      # than whether we were the ones who produced it, so an owner who ran the bootstrap by
      # hand is indistinguishable from the steps above having worked.
      - name: Verify the project is ready
        run: |
          MISSING=0

          if gcloud artifacts repositories describe "${REPOSITORY}" --location="${REGION}" --project="${{ secrets.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            echo "OK    artifact registry: ${REPOSITORY} exists in ${REGION}"
          else
            echo "FAIL  artifact registry: ${REPOSITORY} not found in ${REGION}"
            MISSING=1
          fi

          if gcloud run services list --region="${REGION}" --project="${{ secrets.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            echo "OK    cloud run: reachable, and this account may list services"
          else
            echo "FAIL  cloud run: API disabled, or roles/run.admin missing"
            MISSING=1
          fi

          if [ "$MISSING" = "1" ]; then
            cat >> $GITHUB_STEP_SUMMARY <<'MSG'
          ## Bootstrap needed

          This deploy account cannot enable APIs or create repositories, which is correct —
          those need project-admin rights and a deploy key should not hold them.

          Ask the project owner to run this once in their Cloud Shell:

          ```bash
          export PROJECT=PROJECT_ID_HERE
          export SA=SA_EMAIL_HERE

          gcloud services enable run.googleapis.com artifactregistry.googleapis.com --project=$PROJECT
          gcloud artifacts repositories create sentinel --repository-format=docker --location=asia-south1 --project=$PROJECT

          for role in roles/run.admin roles/artifactregistry.writer roles/iam.serviceAccountUser; do
            gcloud projects add-iam-policy-binding $PROJECT --member="serviceAccount:$SA" --role=$role --condition=None
          done
          ```
          MSG
            echo
            echo "Not ready. See the job summary for the commands the project owner must run."
            exit 1
          fi

          echo "Project is ready to deploy."

  configure:
    if: inputs.step == 'configure'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Written to a file rather than passed as --set-env-vars. Values never appear in a
      # command line that way, `,` and `=` inside a value cannot be misparsed, and the file
      # lives only for the length of this step.
      - name: Configure the API
        env:
          DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
          PSEUDONYM_KEY_V1: ${{ secrets.APP_PSEUDONYM_KEY }}
          PAYLOAD_KEY_V1: ${{ secrets.APP_PAYLOAD_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.APP_RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.APP_RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.APP_RAZORPAY_WEBHOOK_SECRET }}
        run: |
          umask 077
          python3 - <<'PY' > env.yaml
          import json, os
          keys = [
              "DATABASE_URL", "PSEUDONYM_KEY_V1", "PAYLOAD_KEY_V1",
              "RAZORPAY_KEY_ID", "RAZORPAY_KEY_SECRET", "RAZORPAY_WEBHOOK_SECRET",
          ]
          # json.dumps gives a correctly quoted scalar, and JSON is a subset of YAML, so
          # this is safe for any value without needing a YAML library.
          out = {
              "NODE_ENV": "production",
              "TRUST_PROXY": "true",
              "SEED_DEMO_USERS": "true",
          }
          for k in keys:
              v = os.environ.get(k, "")
              if v:
                  out[k] = v
          for k, v in out.items():
              print(f"{k}: {json.dumps(v)}")
          PY

          gcloud run services update sentinel-api \
            --region="${REGION}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --env-vars-file=env.yaml \
            --min-instances=1 \
            --max-instances=1 \
            --no-cpu-throttling \
            --memory=1Gi

          rm -f env.yaml

      - name: Allow the public to reach both services
        run: |
          for svc in sentinel-api sentinel-shop; do
            gcloud run services add-iam-policy-binding "$svc" \
              --region="${REGION}" \
              --project="${{ secrets.GCP_PROJECT_ID }}" \
              --member=allUsers \
              --role=roles/run.invoker || true
          done

      # Each service needs the other's address: the shop to call the API, and the API to
      # accept the shop's origin. Read back from Cloud Run rather than hardcoded, so this
      # keeps working if a service is ever recreated with a different URL.
      - name: Point the two services at each other
        run: |
          API_URL=$(gcloud run services describe sentinel-api --region="${REGION}" --project="${{ secrets.GCP_PROJECT_ID }}" --format='value(status.url)')
          SHOP_URL=$(gcloud run services describe sentinel-shop --region="${REGION}" --project="${{ secrets.GCP_PROJECT_ID }}" --format='value(status.url)')

          gcloud run services update sentinel-shop \
            --region="${REGION}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --memory=256Mi \
            --set-env-vars="API_BASE_URL=${API_URL}"

          gcloud run services update sentinel-api \
            --region="${REGION}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --update-env-vars="^::^WEB_ORIGIN=${API_URL},${SHOP_URL}"

          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Console: ${API_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- Storefront: ${SHOP_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- Webhook: ${API_URL}/api/webhooks/razorpay" >> $GITHUB_STEP_SUMMARY
