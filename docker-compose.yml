# Local development dependencies. Nothing here is a production topology;
# the reference production architecture is in the architecture plan §6.7.
#
# Only Postgres. Redis, MinIO and Mailpit were provisioned here for a while, but no code ever
# connected to them — no client library is imported and no environment variable names them.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentinel']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
